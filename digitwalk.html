<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digit Walk</title>
<meta name="description" content="Turn the digits of any number into a path: each digit is a step length, and the line turns after every step. Type an expression, watch it draw.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='16' fill='%230E1A26'/%3E%3Cpath d='M16 16h4v-5h-8v9h11v-13h-15' fill='none' stroke='%237FE7DC' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..900&display=swap" rel="stylesheet">
<!-- arbitrary-precision decimals (sqrt, ln, exp, trig, pi ...) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/decimal.js/10.4.3/decimal.min.js"></script>
<style>
:root{
  --deep:#0E1A26;
  --deep2:#0A141E;
  --paper:#ECEFF1;
  --ink:#16222E;
  --muted:#506070;
  --rule:#C3CCD3;
  --signal:#B01E56;
  --signal-bright:#FF6E9F;
  --on-deep:#EAF0F5;
  --on-deep-muted:#9FB0C0;
  --sans:"Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100svh;background:var(--paper);color:var(--ink);
  font-family:var(--sans);
  display:flex;flex-direction:column;
}
a{color:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:3px;border-radius:3px}

header{
  padding:1.1rem clamp(1rem,4vw,2rem) .6rem;
  display:flex;align-items:baseline;justify-content:space-between;gap:1rem;flex-wrap:wrap;
}
.brand{display:flex;align-items:baseline;gap:.65rem}
h1{margin:0;font:800 1.35rem/1 var(--sans);letter-spacing:-.02em}
.tag{font:400 .875rem/1 var(--sans);color:var(--muted)}
header a.home{font:500 .875rem var(--sans);color:var(--muted);text-decoration:none;border-bottom:1px solid var(--rule)}
header a.home:hover{color:var(--signal);border-color:var(--signal)}

main{
  flex:1;display:flex;align-items:flex-start;justify-content:center;
  padding:1rem clamp(1rem,4vw,2rem) 2rem;
}
.layout{
  display:grid;grid-template-columns:minmax(0,1fr) 19rem;gap:clamp(1.5rem,4vw,3rem);
  align-items:start;max-width:72rem;width:100%;
}
.stage-col{display:flex;flex-direction:column;align-items:center;gap:1.25rem;min-width:0}

/* --- plots --- */
.plots{
  display:grid;gap:1rem;width:100%;
  grid-template-columns:repeat(auto-fit,minmax(min(100%,15rem),1fr));
}
.plots[data-n="1"]{grid-template-columns:1fr;max-width:32rem}
.plots[data-n="2"]{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{
  background:#fff;border-radius:1.25rem;padding:.9rem;
  box-shadow:inset 0 0 0 1.5px var(--rule);
  display:flex;flex-direction:column;gap:.6rem;min-width:0;
}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:.75rem}
.card-title{
  font:700 .9rem var(--sans);color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;
}
.card-count{font:600 .75rem var(--mono);color:var(--muted);flex-shrink:0}
canvas{display:block;width:100%;aspect-ratio:1;border-radius:.8rem;background:#fff}
.digits{
  font:400 .72rem/1.45 var(--mono);color:var(--muted);word-break:break-all;
  max-height:4.4rem;overflow:auto;padding:.1rem .15rem;
}
.digits .done{color:var(--ink);font-weight:600}
.card-foot{display:flex;justify-content:flex-end}
.empty{
  width:100%;max-width:32rem;text-align:center;padding:2.5rem 1rem;
  font:500 .9rem var(--sans);color:var(--muted);
  background:#fff;border-radius:1.25rem;box-shadow:inset 0 0 0 1.5px var(--rule);
}
.note{font:500 .8125rem/1.5 var(--sans);color:var(--muted);text-align:center;max-width:36rem;margin:0}

/* --- buttons --- */
button{
  font:650 .9rem var(--sans);border:none;border-radius:2rem;padding:.62rem 1.15rem;cursor:pointer;
  background:var(--deep);color:var(--on-deep);
  transition:transform .12s ease, background .15s ease;
}
button:hover{background:#16283A}
button:active{transform:scale(.96)}
button.primary{background:var(--signal-bright);color:var(--deep)}
button.primary:hover{background:#FF8AB2}
button.ghost{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--rule)}
button.ghost:hover{background:rgba(22,34,46,.06);color:var(--ink)}
button.full{width:100%}
button.small{padding:.35rem .8rem;font-size:.75rem}
button:disabled{opacity:.4;cursor:not-allowed}

/* --- side panel --- */
.panel{display:flex;flex-direction:column;gap:1.25rem}
.panel-group{
  background:#fff;border-radius:1.25rem;padding:1.1rem 1.15rem;
  box-shadow:inset 0 0 0 1.5px var(--rule);
  display:flex;flex-direction:column;gap:.7rem;
}
.panel-title{margin:0 0 .1rem;font:700 .8125rem var(--sans);letter-spacing:.02em;color:var(--muted)}
.row-ctrl{display:flex;align-items:center;justify-content:space-between;gap:.75rem}
.row-ctrl label{font:600 .8125rem var(--sans);color:var(--muted);flex-shrink:0}
.row-ctrl select{
  font:650 .875rem var(--sans);color:var(--ink);background:var(--paper);border:none;border-radius:1.5rem;
  padding:.4rem .8rem;cursor:pointer;max-width:11rem;
}
.row-ctrl input[type=range]{width:7rem;accent-color:var(--signal-bright);cursor:pointer}
.speed-val{font:600 .75rem var(--mono);color:var(--muted);width:3.2rem;text-align:right}
.btn-row{display:flex;gap:.6rem}
.btn-row button{flex:1}
.toggle{
  display:flex;align-items:center;gap:.5rem;
  background:var(--paper);border-radius:1.5rem;padding:.5rem 1rem;
  box-shadow:inset 0 0 0 1.5px var(--rule);cursor:pointer;
  font:600 .8125rem var(--sans);color:var(--muted);user-select:none;width:fit-content;
}
.toggle input{accent-color:var(--signal-bright);cursor:pointer;width:1rem;height:1rem}
.toggle:has(input:checked){color:var(--ink)}

/* --- expressions --- */
.expr-list{display:flex;flex-direction:column;gap:.45rem}
.expr-row{display:flex;gap:.4rem;align-items:center}
.expr-row input{
  flex:1;min-width:0;font:500 .9rem var(--mono);color:var(--ink);
  background:var(--paper);border:none;border-radius:1rem;padding:.6rem .85rem;
  box-shadow:inset 0 0 0 1.5px var(--rule);
}
.expr-row input:focus{background:#fff;box-shadow:inset 0 0 0 2px var(--signal-bright);outline:none}
.expr-row input[aria-invalid="true"]{box-shadow:inset 0 0 0 2px var(--signal)}
.expr-row .x{
  width:2rem;height:2rem;padding:0;flex-shrink:0;border-radius:50%;
  background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--rule);font-size:1rem;line-height:1;
}
.expr-row .x:hover{background:rgba(22,34,46,.06);color:var(--ink)}
.errors{margin:0;padding:0;list-style:none;font:500 .78rem/1.4 var(--sans);color:var(--signal)}
.errors:empty{display:none}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.chip{
  padding:.28rem .7rem;font:600 .78rem var(--sans);
  background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--rule);
}
.chip:hover{background:#dfe5e9}

/* --- keypad --- */
.keypad{display:grid;grid-template-columns:repeat(5,1fr);gap:.4rem}
.key{
  padding:.58rem 0;border-radius:.7rem;font:650 .85rem var(--sans);
  background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--rule);
}
.key:hover{background:#dfe5e9}
.key.fn{font-size:.8rem;color:var(--muted)}
.key.op{background:var(--deep);color:var(--on-deep);box-shadow:none}
.key.op:hover{background:#16283A}
.key.act{color:var(--signal)}
.key.go{grid-column:span 2;background:var(--signal-bright);color:var(--deep);box-shadow:none}
.key.go:hover{background:#FF8AB2}

footer{text-align:center;padding:0 1rem 1.5rem;font:400 .8125rem var(--sans);color:var(--muted)}
footer a{color:var(--muted);text-decoration-color:rgba(80,96,112,.4)}
footer a:hover{color:var(--signal)}

@media (max-width:56rem){
  .layout{grid-template-columns:1fr;justify-items:center;max-width:32rem}
  .panel{width:100%;max-width:26rem;order:-1}
}
@media (max-width:36rem){
  .plots[data-n="2"]{grid-template-columns:1fr}
}
@media (max-width:26rem){
  h1{font:800 1.15rem/1 var(--sans)}
  .panel-group{padding:1rem}
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Digit Walk</h1>
    <span class="tag">turn numbers into paths</span>
  </div>
  <a class="home" href="https://phymanshu.github.io/#playground">← back to site</a>
</header>

<main>
  <div class="layout">

    <div class="stage-col">
      <div class="plots" id="plots" data-n="0" aria-live="polite"></div>
      <p class="note" id="note">Every digit is a step length. Walk that many units, turn, repeat. Lines start dark and get lighter towards the end of the number.</p>
    </div>

    <div class="panel">

      <div class="panel-group">
        <h2 class="panel-title">Expressions</h2>
        <div class="expr-list" id="exprList"></div>
        <ul class="errors" id="errors" role="alert"></ul>
        <div class="btn-row">
          <button class="primary" id="drawBtn" type="button">Draw</button>
          <button class="ghost" id="addBtn" type="button">+ Add another</button>
        </div>
        <div class="chips" id="chips" aria-label="Examples"></div>
      </div>

      <div class="panel-group">
        <h2 class="panel-title">Keypad</h2>
        <div class="keypad" id="keypad" role="group" aria-label="Calculator keypad"></div>
      </div>

      <div class="panel-group">
        <h2 class="panel-title">Walk</h2>
        <div class="row-ctrl">
          <label for="digitsSel">Digits</label>
          <select id="digitsSel">
            <option value="10">10</option>
            <option value="25">25</option>
            <option value="50">50</option>
            <option value="100" selected>100</option>
            <option value="250">250</option>
            <option value="500">500</option>
            <option value="1000">1000</option>
          </select>
        </div>
        <div class="row-ctrl">
          <label for="speedRange">Speed</label>
          <input type="range" id="speedRange" min="2" max="80" step="1" value="12">
          <span class="speed-val" id="speedVal">12/s</span>
        </div>
        <div class="row-ctrl">
          <label for="turnSel">Turn</label>
          <select id="turnSel">
            <option value="90" selected>90°</option>
            <option value="60">60°</option>
            <option value="120">120°</option>
            <option value="45">45°</option>
            <option value="72">72°</option>
            <option value="137.5077640500378">Golden angle</option>
          </select>
        </div>
        <div class="row-ctrl">
          <label for="dirSel">Direction</label>
          <select id="dirSel">
            <option value="ccw" selected>Anticlockwise</option>
            <option value="cw">Clockwise</option>
          </select>
        </div>
        <div class="row-ctrl">
          <label for="cmapSel">Colours</label>
          <select id="cmapSel">
            <option value="viridis" selected>Viridis</option>
            <option value="plasma">Plasma</option>
            <option value="inferno">Inferno</option>
          </select>
        </div>
        <label class="toggle"><input type="checkbox" id="skipInt"><span>Skip integer part</span></label>
        <label class="toggle"><input type="checkbox" id="axesToggle" checked><span>Show axes</span></label>
        <div class="btn-row">
          <button class="ghost" id="replayBtn" type="button">Replay</button>
          <button class="ghost" id="finishBtn" type="button">Finish</button>
        </div>
      </div>

    </div>
  </div>
</main>

<footer>
  Part of Himanshu Sharma's <a href="https://phymanshu.github.io/#playground">science playground</a>
</footer>

<script>
(function () {
'use strict';

var $ = function (id) { return document.getElementById(id); };
var plots = $('plots'), exprList = $('exprList'), errorsEl = $('errors');
var digitsSel = $('digitsSel'), speedRange = $('speedRange'), speedVal = $('speedVal');
var turnSel = $('turnSel'), dirSel = $('dirSel'), cmapSel = $('cmapSel');
var skipInt = $('skipInt'), axesToggle = $('axesToggle');
var drawBtn = $('drawBtn'), addBtn = $('addBtn'), replayBtn = $('replayBtn'), finishBtn = $('finishBtn');

var MAX_EXPR = 6;
var GUARD = 15;               // extra digits computed beyond what is drawn
var DPR = Math.min(window.devicePixelRatio || 1, 2.5);
var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

if (typeof Decimal === 'undefined') {
  errorsEl.innerHTML = '<li>The maths library (decimal.js) failed to load. Check your connection and reload.</li>';
  drawBtn.disabled = true;
  return;
}

/* ================= colour maps (matplotlib-style, dark -> light) ================= */
var CMAPS = {
  viridis: ['#440154','#482878','#3e4989','#31688e','#26828e','#1f9e89','#35b779','#6ece58','#b5de2b','#fde725'],
  plasma:  ['#0d0887','#47039f','#7301a8','#9c179e','#bd3786','#d8576b','#ed7953','#fa9e3b','#fdc328','#f0f921'],
  inferno: ['#000004','#1b0c41','#4a0c6b','#781c6d','#a52c60','#cf4446','#ed6925','#fb9b06','#f7d13d','#fcffa4']
};
function hexToRgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
var CMAP_RGB = {};
Object.keys(CMAPS).forEach(function (k) { CMAP_RGB[k] = CMAPS[k].map(hexToRgb); });
function cmapColor(name, t) {
  var st = CMAP_RGB[name], pos = Math.max(0, Math.min(1, t)) * (st.length - 1);
  var i = Math.min(st.length - 2, Math.floor(pos)), f = pos - i, a = st[i], b = st[i + 1];
  return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * f) + ',' + Math.round(a[1] + (b[1] - a[1]) * f) + ',' + Math.round(a[2] + (b[2] - a[2]) * f) + ')';
}

/* ================= expression evaluator (arbitrary precision) ================= */
function tokenize(src) {
  src = src.replace(/[×·∙]/g, '*').replace(/÷/g, '/').replace(/[−–—]/g, '-')
           .replace(/\*\*/g, '^').replace(/π/g, ' pi ').replace(/φ/g, ' phi ')
           .replace(/√/g, ' sqrt ').replace(/∛/g, ' cbrt ');
  var out = [], i = 0, m, rest;
  while (i < src.length) {
    var c = src[i];
    if (/\s/.test(c)) { i++; continue; }
    rest = src.slice(i);
    if ((m = /^(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?/.exec(rest))) { out.push({ t: 'num', v: m[0] }); i += m[0].length; continue; }
    if ((m = /^(?:log10|log2|[a-zA-Z]+)/.exec(rest))) { out.push({ t: 'id', v: m[0].toLowerCase() }); i += m[0].length; continue; }
    if ('+-*/^()!'.indexOf(c) >= 0) { out.push({ t: 'op', v: c }); i++; continue; }
    throw new Error('unexpected "' + c + '"');
  }
  return out;
}

function evaluate(src, D) {
  var toks = tokenize(src), p = 0;
  var cache = {};
  var CONST = {
    pi:  function () { return D.acos(-1); },
    e:   function () { return D.exp(1); },
    phi: function () { return D.add(1, D.sqrt(5)).div(2); },
    tau: function () { return D.acos(-1).times(2); }
  };
  var FUN = {
    sqrt: function (x) { return x.sqrt(); },   cbrt: function (x) { return x.cbrt(); },
    ln:   function (x) { return x.ln(); },     log:  function (x) { return x.log(10); },
    log10: function (x) { return x.log(10); }, log2: function (x) { return x.log(2); },
    exp:  function (x) { return x.exp(); },    abs:  function (x) { return x.abs(); },
    sin:  function (x) { return x.sin(); },    cos:  function (x) { return x.cos(); },
    tan:  function (x) { return x.tan(); },    asin: function (x) { return x.asin(); },
    acos: function (x) { return x.acos(); },   atan: function (x) { return x.atan(); },
    sinh: function (x) { return x.sinh(); },   cosh: function (x) { return x.cosh(); },
    tanh: function (x) { return x.tanh(); }
  };
  function isOp(v) { return toks[p] && toks[p].t === 'op' && toks[p].v === v; }
  function fact(x) {
    if (!x.isInt() || x.isNeg()) throw new Error('! needs a whole number ≥ 0');
    if (x.gt(1000)) throw new Error('factorial is limited to 1000!');
    var r = new D(1);
    for (var i = 2, n = x.toNumber(); i <= n; i++) r = r.times(i);
    return r;
  }
  function parseExpr() {
    var v = parseTerm();
    while (isOp('+') || isOp('-')) {
      var o = toks[p++].v, r = parseTerm();
      v = o === '+' ? v.plus(r) : v.minus(r);
    }
    return v;
  }
  function parseTerm() {
    var v = parseUnary();
    for (;;) {
      if (isOp('*')) { p++; v = v.times(parseUnary()); }
      else if (isOp('/')) { p++; v = v.div(parseUnary()); }
      else if (toks[p] && (toks[p].t === 'id' || isOp('('))) { v = v.times(parseUnary()); } // implicit: 2pi, 3(4+1)
      else break;
    }
    return v;
  }
  function parseUnary() {
    if (isOp('-')) { p++; return parseUnary().neg(); }
    if (isOp('+')) { p++; return parseUnary(); }
    return parsePower();
  }
  function parsePower() {
    var b = parsePostfix();
    if (isOp('^')) { p++; return b.pow(parseUnary()); }
    return b;
  }
  function parsePostfix() {
    var v = parseAtom();
    while (isOp('!')) { p++; v = fact(v); }
    return v;
  }
  function parseAtom() {
    var t = toks[p];
    if (!t) throw new Error('expression ended unexpectedly');
    if (t.t === 'num') { p++; return new D(t.v); }
    if (t.t === 'op' && t.v === '(') {
      p++;
      var v = parseExpr();
      if (!isOp(')')) throw new Error('missing )');
      p++;
      return v;
    }
    if (t.t === 'id') {
      p++;
      if (CONST[t.v]) return cache[t.v] || (cache[t.v] = CONST[t.v]());
      if (FUN[t.v]) {
        var a;
        if (isOp('(')) {
          p++; a = parseExpr();
          if (!isOp(')')) throw new Error('missing ) after ' + t.v);
          p++;
        } else {
          a = parsePostfix();
        }
        return FUN[t.v](a);
      }
      throw new Error('unknown name "' + t.v + '"');
    }
    throw new Error('unexpected "' + t.v + '"');
  }

  if (!toks.length) throw new Error('empty expression');
  var result = parseExpr();
  if (p < toks.length) throw new Error('unexpected "' + toks[p].v + '"');
  if (!result.isFinite()) throw new Error('result is not a finite real number');
  return result;
}

function extractDigits(value, N, skipInteger) {
  var s = value.abs().toFixed();                 // plain notation, trailing zeros trimmed
  var parts = s.split('.'), ip = parts[0], fp = parts[1] || '';
  var d = skipInteger ? fp : (ip === '0' ? '' : ip) + fp;
  d = d.slice(0, N);
  if (!d) throw new Error('no digits to draw (result is zero or a whole number with "skip integer part" on)');
  return d;
}

/* ================= cards / drawing ================= */
var cards = [];
var progress = 0, lastT = 0, raf = 0;

function currentTheta() {
  return parseFloat(turnSel.value) * Math.PI / 180 * (dirSel.value === 'cw' ? -1 : 1);
}

function computePath(card) {
  var n = card.digits.length, th = currentTheta();
  var xs = new Float64Array(n + 1), ys = new Float64Array(n + 1);
  var x = 0, y = 0, h = 0;
  for (var i = 0; i < n; i++) {
    var len = card.digits.charCodeAt(i) - 48;
    x += len * Math.cos(h); y += len * Math.sin(h);
    xs[i + 1] = x; ys[i + 1] = y;
    h += th;
  }
  card.xs = xs; card.ys = ys;
  var minX = 0, maxX = 0, minY = 0, maxY = 0;     // origin always included
  for (var j = 1; j <= n; j++) {
    if (xs[j] < minX) minX = xs[j]; if (xs[j] > maxX) maxX = xs[j];
    if (ys[j] < minY) minY = ys[j]; if (ys[j] > maxY) maxY = ys[j];
  }
  card.bbox = [minX, maxX, minY, maxY];
}

function recolor(card) {
  var n = card.digits.length, name = cmapSel.value;
  card.colors = new Array(n);
  for (var i = 0; i < n; i++) card.colors[i] = cmapColor(name, i / n);   // same rule as the python: i / total
}

function layout(card) {
  var rect = card.canvas.getBoundingClientRect();
  var size = rect.width || 300;
  card.size = size;
  card.canvas.width = Math.round(size * DPR);
  card.canvas.height = Math.round(size * DPR);
  card.ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  var b = card.bbox, w = b[1] - b[0], h = b[3] - b[2];
  var pad = size * 0.07, span = Math.max(w, h);
  card.sc = span > 0 ? (size - 2 * pad) / span : 1;
  card.ox = (size - w * card.sc) / 2 - b[0] * card.sc;
  card.oy = (size + h * card.sc) / 2 + b[2] * card.sc;    // y is flipped on screen
}

function render(card, prog) {
  var ctx = card.ctx, size = card.size, n = card.digits.length;
  ctx.clearRect(0, 0, size, size);
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, size, size);

  if (axesToggle.checked) {
    ctx.strokeStyle = '#B4BCC3'; ctx.lineWidth = 0.75;
    var m = size * 0.03;
    ctx.beginPath();
    ctx.moveTo(m, card.oy); ctx.lineTo(size - m, card.oy);
    ctx.moveTo(card.ox, m); ctx.lineTo(card.ox, size - m);
    ctx.stroke();
  }

  var lw = n <= 50 ? 2 : n <= 150 ? 1.6 : n <= 500 ? 1.1 : 0.8;
  ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  var full = Math.min(Math.floor(prog), n), frac = Math.min(prog, n) - full;
  var sc = card.sc, ox = card.ox, oy = card.oy, xs = card.xs, ys = card.ys, i;

  for (i = 0; i < full; i++) {
    if (xs[i] === xs[i + 1] && ys[i] === ys[i + 1]) continue;
    ctx.strokeStyle = card.colors[i];
    ctx.beginPath();
    ctx.moveTo(ox + xs[i] * sc, oy - ys[i] * sc);
    ctx.lineTo(ox + xs[i + 1] * sc, oy - ys[i + 1] * sc);
    ctx.stroke();
  }
  var tipX = ox + xs[full] * sc, tipY = oy - ys[full] * sc;
  if (full < n && frac > 0) {
    tipX = ox + (xs[full] + (xs[full + 1] - xs[full]) * frac) * sc;
    tipY = oy - (ys[full] + (ys[full + 1] - ys[full]) * frac) * sc;
    ctx.strokeStyle = card.colors[full];
    ctx.beginPath();
    ctx.moveTo(ox + xs[full] * sc, oy - ys[full] * sc);
    ctx.lineTo(tipX, tipY);
    ctx.stroke();
  }

  // start point (green, as in the original plots)
  ctx.fillStyle = '#0a7d0a';
  ctx.beginPath(); ctx.arc(ox, oy, 3.2, 0, Math.PI * 2); ctx.fill();

  // moving tip while animating; disappears when the drawing freezes
  if (prog < n) {
    ctx.fillStyle = card.colors[Math.min(full, n - 1)];
    ctx.beginPath(); ctx.arc(tipX, tipY, lw + 1.6, 0, Math.PI * 2); ctx.fill();
  }

  // text under the canvas
  var k = Math.min(n, Math.floor(prog));
  if (k !== card.shown) {
    card.shown = k;
    card.doneEl.textContent = card.digits.slice(0, k);
    card.restEl.textContent = card.digits.slice(k);
    card.countEl.textContent = k + ' / ' + n;
  }
}

function renderAll() {
  cards.forEach(function (c) { render(c, progress); });
}

function stopLoop() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }

function frame(now) {
  var dt = Math.min(100, now - lastT); lastT = now;
  progress += parseFloat(speedRange.value) * dt / 1000;
  var running = false;
  cards.forEach(function (c) {
    render(c, progress);
    if (progress < c.digits.length) running = true;
  });
  raf = running ? requestAnimationFrame(frame) : 0;   // done -> freeze, loop stops
}

function startAnimation() {
  stopLoop();
  if (reduceMotion) { finish(); return; }
  progress = 0;
  cards.forEach(function (c) { c.shown = -1; });
  renderAll();
  lastT = performance.now();
  raf = requestAnimationFrame(frame);
}

function finish() {
  stopLoop();
  progress = 1e9;
  cards.forEach(function (c) { c.shown = -1; });
  renderAll();
}

function slug(s) { return s.replace(/[^a-z0-9]+/gi, '_').replace(/^_|_$/g, '').slice(0, 30) || 'walk'; }

function makeCard(label, digits) {
  var el = document.createElement('article');
  el.className = 'card';
  el.innerHTML =
    '<div class="card-head"><span class="card-title"></span><span class="card-count"></span></div>' +
    '<canvas role="img"></canvas>' +
    '<div class="digits"><span class="done"></span><span class="rest"></span></div>' +
    '<div class="card-foot"><button class="ghost small" type="button">Save image</button></div>';
  var card = {
    el: el, label: label, digits: digits, shown: -1,
    canvas: el.querySelector('canvas'),
    doneEl: el.querySelector('.done'), restEl: el.querySelector('.rest'),
    countEl: el.querySelector('.card-count')
  };
  el.querySelector('.card-title').textContent = label;
  el.querySelector('.card-title').title = label;
  card.canvas.setAttribute('aria-label', 'Digit walk of ' + label + ' (' + digits.length + ' digits)');
  card.ctx = card.canvas.getContext('2d');
  el.querySelector('button').addEventListener('click', function () {
    var a = document.createElement('a');
    a.download = 'digitwalk-' + slug(label) + '.png';
    a.href = card.canvas.toDataURL('image/png');
    a.click();
  });
  return card;
}

function setErrors(list) {
  errorsEl.innerHTML = '';
  list.forEach(function (msg) {
    var li = document.createElement('li');
    li.textContent = msg;
    errorsEl.appendChild(li);
  });
}

function draw() {
  stopLoop();
  var N = parseInt(digitsSel.value, 10);
  var D = Decimal.clone({ precision: N + GUARD });
  var errs = [], built = [];
  var inputs = exprList.querySelectorAll('input');
  Array.prototype.forEach.call(inputs, function (inp, idx) {
    inp.removeAttribute('aria-invalid');
    var src = inp.value.trim();
    if (!src) return;
    try {
      var val = evaluate(src, D);
      built.push(makeCard(src, extractDigits(val, N, skipInt.checked)));
    } catch (err) {
      inp.setAttribute('aria-invalid', 'true');
      errs.push('Expression ' + (idx + 1) + ': ' + String(err.message || err).replace(/^\[DecimalError\]\s*/, ''));
    }
  });
  setErrors(errs);

  plots.innerHTML = '';
  cards = built;
  plots.setAttribute('data-n', String(cards.length));
  if (!cards.length) {
    var e = document.createElement('div');
    e.className = 'empty';
    e.textContent = errs.length ? 'Fix the expression to see its walk.' : 'Type an expression or tap the keypad, then press Draw.';
    plots.appendChild(e);
    return;
  }
  cards.forEach(function (c) { plots.appendChild(c.el); });
  cards.forEach(function (c) { computePath(c); recolor(c); layout(c); });
  startAnimation();

  if (window.matchMedia('(max-width:56rem)').matches) {
    plots.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
  }
}

/* ================= expression rows & keypad ================= */
var activeInput = null;

function addRow(value) {
  if (exprList.children.length >= MAX_EXPR) return null;
  var row = document.createElement('div');
  row.className = 'expr-row';
  var inp = document.createElement('input');
  inp.type = 'text';
  inp.value = value || '';
  inp.placeholder = 'e.g. sqrt(2)/10';
  inp.spellcheck = false;
  inp.autocomplete = 'off';
  inp.setAttribute('autocapitalize', 'off');
  inp.setAttribute('aria-label', 'Numerical expression');
  inp.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); draw(); } });
  var x = document.createElement('button');
  x.type = 'button'; x.className = 'x'; x.textContent = '×';
  x.setAttribute('aria-label', 'Remove this expression');
  x.addEventListener('click', function () {
    if (exprList.children.length > 1) { row.remove(); } else { inp.value = ''; inp.focus(); }
    syncRows();
  });
  row.appendChild(inp); row.appendChild(x);
  exprList.appendChild(row);
  syncRows();
  return inp;
}

function syncRows() {
  addBtn.disabled = exprList.children.length >= MAX_EXPR;
  var multi = exprList.children.length > 1;
  Array.prototype.forEach.call(exprList.querySelectorAll('.x'), function (b) { b.style.visibility = multi ? 'visible' : 'hidden'; });
  if (!activeInput || !document.body.contains(activeInput)) activeInput = exprList.querySelector('input');
}

exprList.addEventListener('focusin', function (ev) { if (ev.target.tagName === 'INPUT') activeInput = ev.target; });

function insertText(text) {
  var el = activeInput || exprList.querySelector('input');
  if (!el) return;
  var s = el.selectionStart == null ? el.value.length : el.selectionStart;
  var e = el.selectionEnd == null ? s : el.selectionEnd;
  el.value = el.value.slice(0, s) + text + el.value.slice(e);
  var pos = s + text.length;
  el.focus();
  el.setSelectionRange(pos, pos);
}
function backspace() {
  var el = activeInput || exprList.querySelector('input');
  if (!el) return;
  var s = el.selectionStart == null ? el.value.length : el.selectionStart;
  var e = el.selectionEnd == null ? s : el.selectionEnd;
  if (s === e && s > 0) s--;
  el.value = el.value.slice(0, s) + el.value.slice(e);
  el.focus();
  el.setSelectionRange(s, s);
}

// [label, action, kind, title]
var KEYS = [
  ['π', 'pi', 'fn', 'pi'], ['e', 'e', 'fn', 'Euler’s number'], ['φ', 'phi', 'fn', 'golden ratio'], ['(', '(', 'op'], [')', ')', 'op'],
  ['√', 'sqrt(', 'fn', 'square root'], ['x²', '^2', 'fn', 'square'], ['xʸ', '^', 'op', 'power'], ['ln', 'ln(', 'fn', 'natural log'], ['log', 'log(', 'fn', 'log base 10'],
  ['sin', 'sin(', 'fn', 'radians'], ['cos', 'cos(', 'fn', 'radians'], ['tan', 'tan(', 'fn', 'radians'], ['exp', 'exp(', 'fn', 'e to the power'], ['n!', '!', 'fn', 'factorial'],
  ['7', '7', 'num'], ['8', '8', 'num'], ['9', '9', 'num'], ['÷', '/', 'op', 'divide'], ['⌫', '@BACK', 'act', 'backspace'],
  ['4', '4', 'num'], ['5', '5', 'num'], ['6', '6', 'num'], ['×', '*', 'op', 'multiply'], ['AC', '@CLEAR', 'act', 'clear this expression'],
  ['1', '1', 'num'], ['2', '2', 'num'], ['3', '3', 'num'], ['−', '-', 'op', 'minus'], ['|x|', 'abs(', 'fn', 'absolute value'],
  ['0', '0', 'num'], ['.', '.', 'num'], ['+', '+', 'op'], ['Draw', '@DRAW', 'go', 'evaluate and draw']
];
var keypad = $('keypad');
KEYS.forEach(function (k) {
  var b = document.createElement('button');
  b.type = 'button';
  b.className = 'key ' + k[2];
  b.textContent = k[0];
  if (k[3]) { b.title = k[3]; b.setAttribute('aria-label', k[3]); }
  b.addEventListener('mousedown', function (ev) { ev.preventDefault(); });   // keep caret in the input
  b.addEventListener('click', function () {
    if (k[1] === '@BACK') backspace();
    else if (k[1] === '@CLEAR') { var el = activeInput || exprList.querySelector('input'); if (el) { el.value = ''; el.focus(); } }
    else if (k[1] === '@DRAW') draw();
    else insertText(k[1]);
  });
  keypad.appendChild(b);
});

var EXAMPLES = [['π', 'pi'], ['e', 'e'], ['√2', 'sqrt(2)'], ['φ', 'phi'], ['1/7', '1/7'], ['ln 2', 'ln(2)']];
EXAMPLES.forEach(function (ex) {
  var b = document.createElement('button');
  b.type = 'button'; b.className = 'chip'; b.textContent = ex[0];
  b.addEventListener('click', function () {
    var el = activeInput || exprList.querySelector('input');
    el.value = ex[1];
    draw();
  });
  $('chips').appendChild(b);
});

/* ================= wiring ================= */
drawBtn.addEventListener('click', draw);
addBtn.addEventListener('click', function () { var i = addRow(''); if (i) i.focus(); });
replayBtn.addEventListener('click', function () { if (cards.length) startAnimation(); });
finishBtn.addEventListener('click', function () { if (cards.length) finish(); });

speedRange.addEventListener('input', function () { speedVal.textContent = speedRange.value + '/s'; });

// changes that need a fresh evaluation
digitsSel.addEventListener('change', draw);
skipInt.addEventListener('change', draw);
// changes that only re-shape the path
function reshape() {
  if (!cards.length) return;
  cards.forEach(function (c) { computePath(c); layout(c); });
  startAnimation();
}
turnSel.addEventListener('change', reshape);
dirSel.addEventListener('change', reshape);
// pure re-paint
cmapSel.addEventListener('change', function () { cards.forEach(recolor); renderAll(); });
axesToggle.addEventListener('change', renderAll);

var resizeTimer = 0;
window.addEventListener('resize', function () {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function () {
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    cards.forEach(function (c) { c.shown = -1; layout(c); });
    renderAll();
  }, 80);
});

// start with pi so the page is never empty
addRow('pi');
draw();
})();
</script>
